<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mycelia — Mushroom RTS</title>
<style>
  :root{ --bg:#0e100d; --panel:#171b14; --panel2:#1f261b; --ink:#e9ede1; --muted:#8f9b82;
    --line:#2d3726; --you:#e8c34a; --foe:#e0524d; --nut:#7fd0a0; }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:var(--bg);color:var(--ink);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:10px;gap:9px;min-height:100vh}
  h1{font-size:16px;margin:0}h1 small{color:var(--muted);font-weight:400;font-size:12px}
  #top{width:100%;max-width:820px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .hud{display:flex;gap:14px;align-items:center;font-variant-numeric:tabular-nums;font-size:13px;flex-wrap:wrap}
  .hud b{font-size:16px}
  .ctrl{display:flex;gap:6px}
  .ctrl button{padding:7px 11px;font-size:13px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;cursor:pointer}
  #terrbar{display:flex;height:16px;width:100%;max-width:820px;border-radius:5px;overflow:hidden;border:1px solid var(--line);background:#0a0c08}
  #terrbar div{transition:width .3s}
  #coach{width:100%;max-width:820px;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--you);border-radius:8px;padding:8px 12px;font-size:13px;line-height:1.4}#coach b{color:var(--ink)}
  canvas{background:#0a0c08;border:1px solid var(--line);border-radius:10px;max-width:100%;height:auto;cursor:pointer}
  #hint{color:var(--muted);font-size:12px;min-height:15px;text-align:center}
  .palette{display:flex;gap:7px;width:100%;max-width:820px;flex-wrap:wrap}
  .palette button{flex:1;min-width:120px;padding:9px 8px;font-size:13px;background:var(--panel);color:var(--ink);border:1px solid var(--line);
    border-radius:9px;cursor:pointer;transition:.12s;text-align:left;line-height:1.25}
  .palette button:hover:not(:disabled){border-color:var(--you)}
  .palette button.sel{border-color:var(--you);background:#2a2f16}
  .palette button:disabled{opacity:.45;cursor:not-allowed}
  .palette .c{color:var(--nut);font-weight:600}
  .palette small{color:var(--muted);font-size:10.5px;display:block}
  .tech{display:flex;gap:7px;width:100%;max-width:820px;flex-wrap:wrap}
  .tech button{flex:1;min-width:120px;padding:8px;font-size:12px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:9px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px}
  .tech button:hover:not(:disabled){border-color:var(--nut)}.tech button:disabled{opacity:.45;cursor:not-allowed}
  .tech .pips{display:flex;gap:2px}.tech .pip{width:7px;height:7px;border-radius:2px;background:#2d3726}.tech .pip.on{background:var(--nut)}
  #log{width:100%;max-width:820px;font-size:12px;color:var(--muted);max-height:70px;overflow-y:auto;display:flex;flex-direction:column-reverse;gap:2px}
  .ov{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
  .ov .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 26px;max-width:440px;text-align:center}
</style>
</head>
<body>
  <div id="top">
    <h1>🍄 Mycelia <small>— mushroom RTS</small></h1>
    <div class="hud">
      <span style="color:var(--nut)">Nutrients <b id="h-nut">—</b></span>
      <span style="color:var(--you)">You <b id="h-you">—</b></span>
      <span style="color:var(--foe)">Rival <b id="h-foe">—</b></span>
      <span class="ctrl"><button id="play">⏸</button><button id="speed">1×</button></span>
    </div>
  </div>
  <div id="terrbar"></div>
  <div id="coach"></div>
  <canvas id="cv" width="812" height="470"></canvas>
  <div id="hint"></div>
  <div class="palette" id="palette"></div>
  <div class="tech" id="tech"></div>
  <div id="log"></div>

<div id="ov" class="ov" style="display:none"><div class="box">
  <h2 id="ov-t"></h2><p id="ov-b" style="color:var(--muted)"></p>
  <button onclick="location.reload()" style="padding:9px 16px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;cursor:pointer">New game ↺</button>
</div></div>

<script src="./engine.js"></script>
<script>
const {createGame, FACTIONS, BUILD, TECH} = Mycelia;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let api,S,you,foe,HS,sel=null,playing=false,speed=1,timer=null;   // start PAUSED so you can read first
const GLYPH={fruit:'🍄',toxin:'☠️',symbiont:'🔗'};
const NODE={dung:'💩',log:'🪵',carrion:'🦴'};   // rich resource nodes, clearly marked

api=createGame({playerControlled:true, log:m=>logMsg(m)});
S=api.state; you=api.you(); foe=api.foe();
const S3=Math.sqrt(3);
HS=Math.min(15, Math.floor((cv.width-6)/((S.COLS+0.5)*S3)));
cv.width=Math.ceil((S.COLS+0.5)*S3*HS)+4; cv.height=Math.ceil(HS*1.5*S.ROWS+HS/2)+4;

function hexC(x,y){ return { cx:HS*S3*(x+0.5*(y&1))+HS*S3/2+2, cy:HS*1.5*y+HS+2 }; }
function hexPath(cx,cy){ ctx.beginPath(); for(let i=0;i<6;i++){ const a=Math.PI/180*(60*i-90);
  const px=cx+HS*Math.cos(a), py=cy+HS*Math.sin(a); i?ctx.lineTo(px,py):ctx.moveTo(px,py);} ctx.closePath(); }
function pixelToTile(px,py){ let best=null,bd=1e9; for(const t of S.grid){ const {cx,cy}=hexC(t.x,t.y);
  const d=(cx-px)**2+(cy-py)**2; if(d<bd){bd=d;best=t;} } return bd<HS*HS?best:null; }

function render(){
  ctx.clearRect(0,0,cv.width,cv.height);
  const valid = sel && !S.over ? new Set(S.grid.filter(t=>api.canPlace(you,sel,t))) : new Set();
  for(const t of S.grid){ const {cx,cy}=hexC(t.x,t.y);
    hexPath(cx,cy);
    if(t.owner){
      // OWNED = bold, opaque faction colour so it's unmistakable whose ground it is.
      ctx.fillStyle=FACTIONS[t.owner.faction].color; ctx.fill();
      ctx.fillStyle='#00000022'; ctx.fill();                 // slight darken for depth only
    } else {
      // neutral ground: muted substrate, so YOUR colour pops against it
      ctx.fillStyle=api.SUB[t.sub].color; ctx.fill();
      ctx.fillStyle='#0a0c0866'; ctx.fill();
    }
    ctx.lineWidth=valid.has(t)?3:1; ctx.strokeStyle=valid.has(t)?'#ffffff':'#0a0c0855'; ctx.stroke();
    // rich resource nodes get a clear marker even when unclaimed
    if(!t.owner && api.SUB[t.sub].rich>=3){ ctx.fillStyle='#000000'; ctx.font=(HS*0.8|0)+'px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(NODE[t.sub]||'',cx,cy+1); }
    if(t.struct){ ctx.font=(HS*1.05|0)+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(GLYPH[t.struct],cx,cy+1); }
  }
}

function palette(){
  const box=document.getElementById('palette'); box.innerHTML='';
  for(const k in BUILD){ const b=BUILD[k]; const el=document.createElement('button');
    el.className=sel===k?'sel':''; el.dataset.k=k;
    el.innerHTML=`${({hyphae:'🌱',fruit:'🍄',toxin:'☠️',symbiont:'🔗'})[k]} ${b.name} <span class="c">${api.cost(you,k)}</span><small>${b.desc}</small>`;
    el.onclick=()=>{ sel=sel===k?null:k; palette();
      document.getElementById('hint').textContent=sel?`Click a highlighted tile to build ${BUILD[sel].name}.`:''; render(); };
    box.appendChild(el);
  }
}
function techPanel(){ const box=document.getElementById('tech'); box.innerHTML='';
  for(const k in TECH){ const lvl=you.tech[k], c=api.techCost(lvl); const el=document.createElement('button');
    el.disabled=lvl>=5||you.nutrients<c;
    el.innerHTML=`<span>${TECH[k].name} <span class="pips">${[...Array(5)].map((_,i)=>`<span class="pip ${i<lvl?'on':''}"></span>`).join('')}</span></span><span class="c" style="color:var(--nut)">${lvl>=5?'max':c}</span>`;
    el.title=TECH[k].desc;
    el.onclick=()=>{ if(api.evolve(you,k)){ logMsg('Evolved '+TECH[k].name+' → '+(lvl+1)); sync(); } };
    box.appendChild(el);
  }
}
function sync(){
  document.getElementById('h-nut').textContent=Math.floor(you.nutrients)+'/'+api.nutrientCap+' (+'+Math.round(api.income(you)*0.1)+')';
  document.getElementById('h-you').textContent=api.tilesOf(you)+' ('+Math.round(100*api.share(you))+'%)';
  document.getElementById('h-foe').textContent=api.tilesOf(foe)+' ('+Math.round(100*api.share(foe))+'%)';
  const v=api.viable(), bar=document.getElementById('terrbar'); bar.innerHTML='';
  const add=(w,c)=>{ const d=document.createElement('div'); d.style.width=w+'%'; d.style.background=c; bar.appendChild(d); };
  add(100*api.tilesOf(you)/v, FACTIONS[you.faction].color);
  add(100*api.tilesOf(foe)/v, FACTIONS[foe.faction].color); add(100*(v-api.tilesOf(you)-api.tilesOf(foe))/v,'#20241c');
  palette(); techPanel(); coach();
}
function coach(){ const el=document.getElementById('coach'); let m;
  if(!playing && S.tick===0) m=`<b>You are gold (left); the rival is red (right).</b> Your mycelium spreads by itself toward rich ground. You just spend nutrients on <b>🍄 Fruiting</b> (surges growth in an area), <b>☠️ Toxin</b> (attacks the rival), <b>🔗 Symbiont</b> (more income), and <b>tech</b>. Read the board — the resource nodes are 💩 dung, 🪵 logs, 🦴 carcasses — then press <b>▶ Play</b>.`;
  else if(!api.owned(you).some(t=>t.struct) && you.nutrients>=16) m=`<b>Make your first move.</b> Pick <b>🍄 Fruiting</b>, then click one of your gold tiles near a rich node to surge your growth toward it.`;
  else if(api.frontier(you).some(t=>api.neighbors(t).some(n=>n.owner===foe))) m=`<b>You've met the rival (red).</b> Build <b>☠️ Toxin</b> on your front tiles to poison and push into their ground.`;
  else m=`<b>Grow, build, tech.</b> Mycelium spreads itself; you place structures and evolve. Take 60% of the floor to win. Use <b>⏸</b> any time to plan.`;
  el.innerHTML=m;
}

cv.addEventListener('click',e=>{ if(!sel||S.over)return; const r=cv.getBoundingClientRect();
  const t=pixelToTile((e.clientX-r.left)*(cv.width/r.width),(e.clientY-r.top)*(cv.height/r.height));
  if(t && api.build(you,sel,t)){ render(); sync(); }
  else document.getElementById('hint').textContent = t? 'Can’t build there (need your own tile / enough nutrients).' : ''; });

document.getElementById('play').onclick=()=>{ playing=!playing; document.getElementById('play').textContent=playing?'⏸':'▶'; loop(); };
document.getElementById('speed').onclick=()=>{ speed=speed>=4?1:speed*2; document.getElementById('speed').textContent=speed+'×'; loop(); };
function loop(){ if(timer)clearInterval(timer); if(!playing||S.over)return;
  timer=setInterval(()=>{ api.tick(); render(); sync(); if(S.over){clearInterval(timer);endScreen();} }, Math.round(820/speed)); }

function logMsg(m){const t=(typeof S!=='undefined'&&S)?S.tick:0;const d=document.getElementById('log');const e=document.createElement('div');e.textContent='['+t+'] '+m;d.appendChild(e);while(d.children.length>25)d.removeChild(d.firstChild);}
function endScreen(){ const me=S.winnerCol&&S.winnerCol.isYou;
  document.getElementById('ov-t').textContent=me?'🍄 Victory!':`${FACTIONS[S.winner].name} wins`;
  document.getElementById('ov-b').textContent=`${me?'You':FACTIONS[S.winner].name} took ${Math.round(100*api.share(S.winnerCol))}% of the forest floor.`;
  document.getElementById('ov').style.display='flex'; }

document.getElementById('play').textContent='▶';   // start paused — read first
render(); sync();
logMsg('Paused. You are GOLD. Read the board, then press ▶ to begin.');
</script>
</body>
</html>
