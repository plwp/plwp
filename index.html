<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mycelia — Tactical Duel</title>
<style>
  :root{ --bg:#0e100d; --panel:#171b14; --panel2:#1f261b; --ink:#e9ede1; --muted:#8f9b82;
    --line:#2d3726; --you:#e8c34a; --foe:#e0524d; }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:var(--bg);color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:14px;gap:12px;min-height:100vh}
  h1{font-size:18px;margin:0}h1 small{color:var(--muted);font-weight:400;font-size:13px}
  #bar{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .score{display:flex;gap:14px;font-variant-numeric:tabular-nums;font-size:14px}
  .score b{font-size:18px}
  #coach{width:100%;max-width:520px;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--you);
    border-radius:8px;padding:9px 12px;font-size:13px;line-height:1.4}#coach b{color:var(--ink)}
  canvas{background:#0a0c08;border:1px solid var(--line);border-radius:12px;touch-action:manipulation}
  #hint{color:var(--muted);font-size:13px;min-height:18px;text-align:center;max-width:520px}
  .acts{display:flex;gap:8px;width:100%;max-width:520px}
  .acts button{flex:1;padding:12px 6px;font-size:14px;background:var(--panel);color:var(--ink);border:1px solid var(--line);
    border-radius:10px;cursor:pointer;transition:.12s;display:flex;flex-direction:column;align-items:center;gap:3px}
  .acts button small{color:var(--muted);font-size:10.5px;font-weight:400}
  .acts button:hover:not(:disabled){border-color:var(--you)}
  .acts button.sel{border-color:var(--you);background:#2a2f16;color:var(--you)}
  .acts button:disabled{opacity:.4;cursor:not-allowed}
  #log{width:100%;max-width:520px;font-size:12px;color:var(--muted);max-height:88px;overflow-y:auto;display:flex;flex-direction:column-reverse;gap:2px}
  .ov{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
  .ov .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px 26px;max-width:460px;text-align:left}
  .ov h2{margin:0 0 8px}
</style>
</head>
<body>
  <div id="bar">
    <h1>🍄 Mycelia <small>— tactical duel</small></h1>
    <div class="score"><span style="color:var(--you)">You <b id="sc-you">1</b></span><span style="color:var(--foe)">Rival <b id="sc-foe">1</b></span><span style="color:var(--muted)">R<b id="rnd">1</b></span></div>
  </div>
  <div id="coach"></div>
  <canvas id="cv" width="520" height="470"></canvas>
  <div id="hint"></div>
  <div class="acts">
    <button id="a-grow" data-a="grow">🌱 Grow<small>claim a tile</small></button>
    <button id="a-edible" data-a="edible">🍄 Edible<small>lure &amp; spread</small></button>
    <button id="a-toxic" data-a="toxic">☠️ Toxic<small>kill / wall</small></button>
    <button id="a-mimic" data-a="mimic">🎭 Mimic<small>hidden trap</small></button>
  </div>
  <div id="log"></div>

<div id="ov" class="ov" style="display:none"><div class="box" style="text-align:center">
  <h2 id="ov-t"></h2><p id="ov-b" style="color:var(--muted)"></p><button onclick="location.reload()" style="padding:9px 16px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;cursor:pointer">New duel ↺</button>
</div></div>

<script src="./engine.js"></script>
<script>
const {createGame, FACTIONS} = Mycelia;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let api,S,you,foe,HS=34,sel=null,ox=0,oy=0,busy=false;

api=createGame({log:m=>logMsg(m)}); S=api.state; you=api.you(); foe=api.foe();
// pixel bounds for centering
(function(){ let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  for(const t of S.tiles){ const {x,y}=hx(t); minx=Math.min(minx,x);miny=Math.min(miny,y);maxx=Math.max(maxx,x);maxy=Math.max(maxy,y);}
  ox=(cv.width-(maxx-minx))/2-minx; oy=(cv.height-(maxy-miny))/2-miny; })();
function hx(t){ return { x:HS*Math.sqrt(3)*(t.q+t.r/2), y:HS*1.5*t.r }; }
function center(t){ const {x,y}=hx(t); return {cx:x+ox, cy:y+oy}; }

function hexPath(cx,cy){ ctx.beginPath();
  for(let i=0;i<6;i++){ const a=Math.PI/180*(60*i-90); const px=cx+HS*0.94*Math.cos(a), py=cy+HS*0.94*Math.sin(a); i?ctx.lineTo(px,py):ctx.moveTo(px,py);} ctx.closePath(); }

function render(){
  ctx.clearRect(0,0,cv.width,cv.height);
  const valid=new Set(sel==='grow'?api.growTargets(you):(sel?api.fruitTargets(you):[]));
  for(const t of S.tiles){ const {cx,cy}=center(t);
    hexPath(cx,cy);
    ctx.fillStyle = t.owner? FACTIONS[t.owner.faction].color+'40' : '#242a1e';
    ctx.fill();
    if(t.owner){ ctx.fillStyle=FACTIONS[t.owner.faction].color+'20'; ctx.fill(); }
    ctx.lineWidth = valid.has(t)?3:1.2;
    ctx.strokeStyle = valid.has(t)? (sel==='toxic'?'#e0524d':sel==='mimic'?'#c47cff':'var(--you)'==='var(--you)'?'#e8c34a':'#e8c34a') : '#3a4531';
    if(valid.has(t)) ctx.strokeStyle = sel==='toxic'?'#e0524d':sel==='mimic'?'#c47cff':'#e8c34a';
    ctx.stroke();
    // mushroom glyph — hide the true nature of the RIVAL's edible/mimic (both look like 🍄)
    if(t.mush){ const m=t.mush; let g='🍄';
      if(m.owner===you){ g = m.type==='toxic'?'☠️':m.type==='mimic'?'🎭':'🍄'; }
      else { g = m.type==='toxic'?'☠️':'🍄'; }         // rival mimic looks edible
      ctx.font='19px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(g,cx,cy+1);
      // owner ring
      ctx.strokeStyle=FACTIONS[m.owner.faction].color; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(cx,cy,HS*0.5,0,7); ctx.stroke();
    }
  }
  // foragers
  for(const f of S.foragers){ const {cx,cy}=center(api.get(f.q,f.r));
    ctx.font='18px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('🐿️',cx,cy-1); }
}

function syncPanel(){
  document.getElementById('sc-you').textContent=you.score+'·'+api.count(you);
  document.getElementById('sc-foe').textContent=foe.score+'·'+api.count(foe);
  document.getElementById('rnd').textContent=S.round;
  // toggle action availability
  document.getElementById('a-grow').disabled=!api.canGrow(you)||busy;
  for(const id of ['a-edible','a-toxic','a-mimic']) document.getElementById(id).disabled=!api.fruitTargets(you).length||busy;
  coach();
}
function coach(){ const el=document.getElementById('coach');
  const nearF=S.foragers.some(f=>api.fruitTargets(you).some(t=>api.dist(t,{q:f.q,r:f.r})<=2));
  let m;
  if(busy) m=`<b>Rival's move…</b> then the foragers wander.`;
  else if(nearF) m=`<b>A forager is near your ground.</b> Grow an <b>🍄 Edible</b> beside it — it'll harvest and spread you. Or set a <b>🎭 Mimic</b> to trap one heading for the rival.`;
  else m=`<b>Your move.</b> Pick a trick, then tap a highlighted tile. <b>🍄 Edible</b> lures foragers, <b>🌱 Grow</b> claims safely, <b>☠️ Toxic</b> walls them off, <b>🎭 Mimic</b> looks edible but kills.`;
  el.innerHTML=m;
}

// ---- interaction ----
for(const b of document.querySelectorAll('.acts button')){ b.onclick=()=>{ if(busy)return;
  sel = sel===b.dataset.a ? null : b.dataset.a;
  for(const x of document.querySelectorAll('.acts button')) x.classList.toggle('sel', x===b && sel);
  document.getElementById('hint').textContent = sel? `Tap a highlighted tile to place your ${sel==='grow'?'mycelium':sel+' mushroom'}.` : '';
  render(); }; }

cv.addEventListener('click',e=>{ if(busy||!sel||S.over)return;
  const r=cv.getBoundingClientRect(); const px=(e.clientX-r.left)*(cv.width/r.width), py=(e.clientY-r.top)*(cv.height/r.height);
  let hit=null,bd=1e9; for(const t of S.tiles){ const {cx,cy}=center(t); const d=(cx-px)**2+(cy-py)**2; if(d<bd){bd=d;hit=t;} }
  if(!hit||bd>HS*HS) return;
  let ok = sel==='grow' ? api.grow(you,hit) : api.fruit(you,hit,sel);
  if(!ok){ document.getElementById('hint').textContent='Not a legal spot for that.'; return; }
  sel=null; for(const x of document.querySelectorAll('.acts button')) x.classList.remove('sel');
  document.getElementById('hint').textContent=''; render(); syncPanel();
  opponentPhase();
});

function opponentPhase(){ busy=true; syncPanel(); render();
  setTimeout(()=>{ api.endTurn(); render(); syncPanel();
    busy=false; syncPanel(); render();
    if(S.over) endScreen();
  }, 550); }

function logMsg(m){const d=document.getElementById('log');const e=document.createElement('div');e.textContent=(S?'R'+S.round+' ':'')+m;d.appendChild(e);while(d.children.length>25)d.removeChild(d.firstChild);}
function endScreen(){ const me=S.winnerP&&S.winnerP.isYou;
  const t = S.reason==='draw'?'A draw' : me?'🍄 You win!':`${FACTIONS[S.winner].name} wins`;
  const b = S.reason==='majority'?'controlled the majority of the forest floor.':S.reason==='draw'?'Even ground when the foragers ran out.':'held the most ground when the foragers ran out.';
  document.getElementById('ov-t').textContent=t;
  document.getElementById('ov-b').textContent=`You ${api.count(you)} tiles vs Rival ${api.count(foe)} — `+b;
  document.getElementById('ov').style.display='flex'; }

render(); syncPanel();
logMsg('A duel begins. Lure the foragers; outwit the rival.');
</script>
</body>
</html>
